<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#060a12" />
    <meta name="color-scheme" content="dark" />
    <meta name="application-name" content="Aero" />
    <meta
      name="description"
      content="Aero — live air quality for anywhere on Earth. Track AQI, PM2.5, and pollutant levels, with hourly and 5-day forecasts."
    />
    <title>Aero · Air quality, everywhere</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      .startup-help {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: #e7edf7;
        background: radial-gradient(ellipse at 50% 0%, #142238 0%, #060a12 65%);
        font-family: Inter, system-ui, sans-serif;
      }
      .startup-card {
        width: min(100%, 520px);
        padding: 32px;
        background: rgba(15, 23, 36, 0.88);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 20px;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
      }
      .startup-brand {
        margin: 0 0 24px;
        color: #7dd3fc;
        font-size: 13px;
        font-weight: 700;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }
      .startup-card h1 {
        margin: 0 0 12px;
        font-family: "Instrument Serif", Georgia, serif;
        font-size: 36px;
        font-weight: 400;
      }
      .startup-card p,
      .startup-card li {
        color: #a7b3c5;
        font-size: 14px;
        line-height: 1.7;
      }
      .startup-card ol {
        margin-bottom: 0;
        padding-left: 20px;
      }
      .startup-card code {
        padding: 3px 7px;
        color: #d9f3ff;
        background: rgba(56, 189, 248, 0.12);
        border-radius: 5px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <section class="startup-help">
        <div class="startup-card">
          <p class="startup-brand">Aero · Air quality</p>
          <h1>Dashboard load nahi hua</h1>
          <p>Is project ko seedha <code>index.html</code> kholkar nahi, Vite server se chalana hota hai.</p>
          <ol>
            <li>Project folder mein terminal kholen.</li>
            <li><code>npm install</code> chalayein (sirf pehli baar).</li>
            <li><code>npm run dev</code> chalayein, phir terminal mein diya gaya localhost link kholen.</li>
          </ol>
        </div>
      </section>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
